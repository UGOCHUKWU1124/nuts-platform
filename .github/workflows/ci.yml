name: CI — Monorepo Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Lockfile Integrity Gate ─────────────────────────────────
  # Runs first, without caching, to fail fast if package.json and
  # package-lock.json are ever out of sync. Blocks all other jobs.
  lockfile-check:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: must validate the lockfile cold

      - name: Assert lockfile is in sync with package.json
        run: npm ci --dry-run

  # ── 1. Code Quality & Linting ──────────────────────────────────
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint Backend & Frontend
        run: npm run lint

  # ── 2. Static Analysis & Type Checking ─────────────────────────
  typecheck:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck Backend & Frontend
        run: npm run typecheck

  # ── 3. Backend Unit & Validation Tests ─────────────────────────
  test-backend:
    name: Backend Validation Tests
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Backend Unit & Validation Tests
        run: npm run test:api

  test-frontend-auth:
    name: Frontend Authentication Tests
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend authentication unit tests
        run: npm run test:unit --workspace=@nuts/web

  # ── 4. Production Build Verification ───────────────────────────
  build-apps:
    name: Build Verification (API & Web)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend, test-frontend-auth]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build API Application
        run: npm run build:api

      - name: Build Web Application
        run: npm run build:web
        env:
          NEXT_PUBLIC_BACKEND_URL: 'https://api.nuts-commerce.com'
          NEXT_PUBLIC_API_URL: '/api/v1'

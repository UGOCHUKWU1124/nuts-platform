name: Enforce PR Source Branch

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - development
      - staging
      - main

jobs:
  assert-development-source:
    name: Assert PR source is not staging or main
    if: github.base_ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source is a feature or fix branch
        shell: bash
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "PR source branch: $SOURCE"
          if [ "$SOURCE" = "main" ] || [ "$SOURCE" = "staging" ]; then
            echo ""
            echo "Promotion Violation: PRs into 'development' cannot originate from '$SOURCE'."
            echo "   Required promotion pipeline: feature/* -> development -> staging -> main"
            echo "   Reverse merges into 'development' from staging/main create drift."
            echo ""
            exit 1
          fi
          echo "Source branch '$SOURCE' is valid for development."

  assert-staging-source:
    name: Assert PR source is 'development'
    if: github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source is development
        shell: bash
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "PR source branch: $SOURCE"
          if [ "$SOURCE" != "development" ] && [[ ! "$SOURCE" =~ ^hotfix/ ]]; then
            echo ""
            echo "Promotion Violation: PRs to 'staging' must originate from 'development' (or hotfix/*)."
            echo "   Required promotion pipeline: feature/* -> development -> staging -> main"
            echo "   Please merge your feature branch into 'development' first."
            echo ""
            exit 1
          fi
          echo "Source branch is '$SOURCE'. Proceeding."

  assert-main-source:
    name: Assert PR source is 'staging'
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate source is staging
        shell: bash
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "PR source branch: $SOURCE"
          if [ "$SOURCE" != "staging" ] && [[ ! "$SOURCE" =~ ^hotfix/ ]]; then
            echo ""
            echo "Promotion Violation: Direct PRs to 'main' must originate from 'staging' (or hotfix/*)."
            echo "   Required promotion pipeline: feature/* -> development -> staging -> main"
            echo "   Code must be deployed and verified on staging before promoting to production."
            echo ""
            exit 1
          fi
          echo "Source branch is '$SOURCE'. Proceeding."

name: Enforce PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  enforce-source-branch:
    name: Assert PR source is 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "PR source branch: $SOURCE"
          if [ "$SOURCE" != "development" ]; then
            echo ""
            echo "❌ Direct PRs to 'main' are not allowed."
            echo "   PRs to 'main' must come from the 'development' branch."
            echo "   Open your PR against 'development' first, then merge development → main."
            echo ""
            exit 1
          fi
          echo "✅ Source branch is 'development'. Proceeding."

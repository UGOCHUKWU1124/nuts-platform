name: CD — Multi-Environment Deployment

on:
  push:
    branches:
      - development
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      docker_tag: ${{ steps.set-env.outputs.docker_tag }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "docker_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "env_name=development" >> $GITHUB_OUTPUT
            echo "docker_tag=dev" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Build & Deploy to ${{ needs.resolve-environment.outputs.env_name }}
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-environment.outputs.env_name }}
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Database Migrations
        run: npx prisma migrate deploy --schema=packages/database/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        if: ${{ env.HAS_DATABASE_URL == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ needs.resolve-environment.outputs.docker_tag }}
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      - name: Build & Push Web Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api.nuts-commerce.com' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ needs.resolve-environment.outputs.docker_tag }}
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}

name: CD — Multi-Environment Deployment

on:
  workflow_run:
    workflows: ["CI — Monorepo Quality Gates"]
    branches:
      - staging
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      docker_tag: ${{ steps.set-env.outputs.docker_tag }}
      image_repository: ${{ steps.set-env.outputs.image_repository }}
    steps:
      - id: set-env
        run: |
          image_repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$TARGET_BRANCH" = "main" ] || [ "${{ inputs.target_env }}" = "production" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "docker_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "docker_tag=staging" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Build & Publish Images to ${{ needs.resolve-environment.outputs.env_name }}
    needs: resolve-environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ needs.resolve-environment.outputs.env_name }}
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Database Migrations
        run: npm run migrate:deploy --workspace=@nuts/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        if: ${{ env.HAS_DATABASE_URL == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ needs.resolve-environment.outputs.image_repository }}/api:${{ needs.resolve-environment.outputs.docker_tag }}
            ${{ needs.resolve-environment.outputs.image_repository }}/api:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build & Push Web Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api.nuts-commerce.com' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
          tags: |
            ${{ needs.resolve-environment.outputs.image_repository }}/web:${{ needs.resolve-environment.outputs.docker_tag }}
            ${{ needs.resolve-environment.outputs.image_repository }}/web:${{ github.event.workflow_run.head_sha || github.sha }}

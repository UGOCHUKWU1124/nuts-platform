worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Only trust this client-IP header when the origin firewall allows Cloudflare IPs only.
  limit_req_zone $http_cf_connecting_ip zone=api_limit:10m rate=30r/s;
  limit_req_zone $http_cf_connecting_ip zone=general_limit:10m rate=50r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent req_id=$request_id rt=$request_time';
  access_log /var/log/nginx/access.log main;

  upstream api_upstream {
    server api-prod:3001;
    keepalive 32;
  }

  upstream client_upstream {
    server client-prod:3000;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
